name: digital_agro_health
description: AgroHealth Flutter App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.6
  dio: ^5.10.0
  connectivity_plus: ^7.3.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.0
  intl: ^0.20.3

  tflite_flutter: ^0.12.1
  image: ^4.1.7

  camera: ^0.12.0+2
  image_picker: ^1.2.3

  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  lottie: ^3.5.1
  provider: ^6.1.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/model/
    - assets/icon/
    - assets/lottie/
    - assets/i18n/